server:
  port: ${PORT:8080}
  forward-headers-strategy: framework   # Vercel/프록시 뒤에서 https/Host 인식 (rate-limit IP, 보안)
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: dms-landing
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1d

# ===== DM'S 랜딩 설정 =====
dms:
  # 데이터(문의 접수 / 사이트설정) 저장 위치. 쓰기 가능한 디렉터리.
  data-dir: ${DMS_DATA_DIR:./data}

  admin:
    username: ${ADMIN_USERNAME:admin}
    # 운영에서는 반드시 BCrypt 해시를 환경변수로 주입한다.
    #   ADMIN_PASSWORD_HASH="$2a$10..."  (권장)
    # 해시가 없을 때만 평문 ADMIN_PASSWORD 를 사용(개발 편의). 기본값은 첫 실행 후 즉시 변경 필요.
    password-hash: ${ADMIN_PASSWORD_HASH:}
    password: ${ADMIN_PASSWORD:change-me-now}

  security:
    # 문의 폼(/api/inquiry)을 외부 사이트(아임웹 등)에서 호출할 수 있도록 허용할 Origin 목록.
    # 비워두면 동일 출처만 허용. 콤마로 구분. 예) https://example.imweb.me,https://www.mystore.com
    allowed-origins: ${ALLOWED_ORIGINS:}
    # 한 IP 당 분당 문의 제출 허용 횟수
    inquiry-rate-per-minute: ${INQUIRY_RATE_PER_MINUTE:5}

  # ===== 외부 연동 (서버 측 비밀값은 전부 환경변수로만 주입. 클라이언트로 노출되지 않음) =====
  integrations:
    # GA4 Measurement Protocol (서버 이벤트 전송, 선택)
    ga4:
      api-secret: ${GA4_API_SECRET:}
    # Meta Conversions API (서버 이벤트 전송, 선택)
    meta:
      access-token: ${META_CAPI_TOKEN:}
    # 카카오 알림톡 / 문자(SMS) 발송 (Solapi 호환 예시). 미설정 시 발송은 건너뛴다.
    messaging:
      provider-url: ${MSG_PROVIDER_URL:}
      api-key: ${MSG_API_KEY:}
      api-secret: ${MSG_API_SECRET:}

logging:
  level:
    com.dms.landing: INFO
