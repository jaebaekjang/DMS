<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>팝업 설정 · DM'S 어드민</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>
<div class="admin-shell">
  <div th:replace="~{admin/fragments :: nav('popup')}"></div>
  <main class="admin-main">
    <h1>팝업 설정</h1>
    <div class="sub">랜딩페이지 진입 시 노출되는 공지/이벤트 팝업을 설정합니다.</div>
    <div class="saved" th:if="${param.saved}">저장되었습니다.</div>

    <form th:action="@{/admin/popup}" th:object="${config.popup}" method="post">
      <div class="card">
        <div class="row">
          <input type="checkbox" id="enabled" th:field="*{enabled}"/>
          <label for="enabled">팝업 사용</label>
        </div>
        <label class="f"><span>제목</span><input type="text" th:field="*{title}"/></label>
        <label class="f"><span>내용</span><textarea th:field="*{body}"></textarea></label>
        <label class="f"><span>이미지 URL (선택)</span><input type="text" th:field="*{imageUrl}" placeholder="https://..."/></label>
        <div class="grid2">
          <label class="f"><span>버튼 문구</span><input type="text" th:field="*{buttonLabel}"/></label>
          <label class="f"><span>버튼 링크</span><input type="text" th:field="*{linkUrl}" placeholder="#inquiry 또는 https://..."/></label>
        </div>
        <label class="f" style="max-width:280px"><span>"오늘 하루 보지 않기" 일수</span><input type="number" min="0" max="30" th:field="*{hideForDays}"/></label>
      </div>
      <button type="submit" class="btn">저장</button>
    </form>
  </main>
</div>
</body>
</html>
