<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>무료 상담 신청</title>
  <link rel="stylesheet" th:href="@{/css/landing.css}"/>
  <style th:inline="text">
    :root {
      --brand: [[${config.design.primaryColor}]];
      --brand-dark: [[${config.design.primaryDark}]];
      --bg: transparent;
      --surface: [[${config.design.surfaceColor}]];
      --text: [[${config.design.textColor}]];
      --muted: [[${config.design.mutedColor}]];
    }
    body { background: transparent; }
    .inquiry { padding: 8px 0; }
  </style>
</head>
<body>
<section class="section inquiry" id="inquiry" style="padding:8px 0">
  <div class="container" style="width:96%">
    <div class="form-title">
      <h2 th:text="${config.design.formTitle}">무료 상담 신청</h2>
      <p th:text="${config.design.formSubtitle}">전문가가 검토 후 빠르게 전화드립니다.</p>
    </div>
    <form class="form-card" id="inquiryForm" autocomplete="on" novalidate>
      <div class="grid-3">
        <div class="field" style="margin-top:0">
          <label>매장명</label>
          <input class="input" type="text" name="storeName" placeholder="예) 맛있는식당" maxlength="100" required/>
        </div>
        <div class="field" style="margin-top:0">
          <label>연락처</label>
          <input class="input" type="tel" name="phone" placeholder="010-1234-5678" maxlength="20" required/>
        </div>
        <div class="field" style="margin-top:0">
          <label>지역</label>
          <select class="select" name="region">
            <option value="">지역을 선택해주세요</option>
            <option th:each="r : ${config.formOptions.regions}" th:value="${r}" th:text="${r}"></option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>현재 문제 <span class="hint">(복수 선택 가능)</span></label>
        <div class="multiselect" id="issueSelect">
          <div class="input multiselect-toggle" id="issueToggle" tabindex="0" role="button" aria-expanded="false">
            <span id="issueLabel" style="color:#6b6b72">현재 문제를 선택해주세요</span><span>▾</span>
          </div>
          <div class="multiselect-panel" id="issuePanel">
            <label th:each="opt : ${config.formOptions.issues}">
              <input type="checkbox" name="issues" th:value="${opt}"/><span th:text="${opt}"></span>
            </label>
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>업종</label>
          <select class="select" name="industry">
            <option value="">업종을 선택해주세요</option>
            <option th:each="i : ${config.formOptions.industries}" th:value="${i}" th:text="${i}"></option>
          </select>
        </div>
        <div class="field">
          <label>평수</label>
          <select class="select" name="size">
            <option value="">평수를 선택해주세요</option>
            <option th:each="s : ${config.formOptions.sizes}" th:value="${s}" th:text="${s}"></option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>문의 내용 <span class="hint">(선택)</span></label>
        <textarea class="textarea" name="message" placeholder="매장 상황이나 문의 내용을 입력해주세요." maxlength="2000"></textarea>
      </div>

      <div class="honeypot" aria-hidden="true">
        <label>회사명<input type="text" name="company" tabindex="-1" autocomplete="off"/></label>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn" th:text="'📨 ' + ${config.design.ctaLabel}">📨 무료 상담 신청하기</button>
      <div class="form-msg" id="formMsg" role="status" aria-live="polite"></div>
      <div class="privacy">🔒 <span th:text="${config.design.privacyNote}">입력하신 정보는 상담 용도로만 사용됩니다.</span></div>
    </form>
  </div>
</section>

<script th:src="@{/js/landing.js}"></script>
<!-- 부모(임베드한 사이트)로 높이를 알려 iframe 자동 리사이즈 -->
<script>
  (function () {
    function postHeight() {
      var h = document.body.scrollHeight;
      parent.postMessage({ type: "dms-embed-height", height: h }, "*");
    }
    window.addEventListener("load", postHeight);
    new ResizeObserver(postHeight).observe(document.body);
  })();
</script>
</body>
</html>
